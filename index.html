
<!DOCTYPE html>

</head>
<body>
    <h1>JavaScript Programs</h1>

    <script>
        let num = 5;
    let factorial = 1;

    for (let i = 1; i <= num; i++) {
        factorial = factorial * i;
    }

    console.log("Factorial = " + factorial);
    </script>
</body>
